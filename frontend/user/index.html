<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-EDGER｜全経簿記 試験対策システム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F4EEDB;
            --card: #FAF6E8;
            --text: #2A1F14;
            --sub: #5C4A3A;
            --green: #2E8B57;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--bg);
            color: var(--text);
            font-family: 'M PLUS 1p', sans-serif;
        }
        .card {
            width: 100%;
            max-width: 560px;
            padding: 40px 28px;
            background: var(--card);
            border: 3px solid var(--text);
            box-shadow: 8px 8px 0 var(--text);
            text-align: center;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            margin-bottom: 16px;
            background: var(--green);
            color: #fff;
            border: 2px solid var(--text);
            font-family: 'Dela Gothic One', sans-serif;
            font-size: 0.8rem;
        }
        h1 {
            font-family: 'Dela Gothic One', sans-serif;
            font-size: 2.4rem;
            letter-spacing: 0.04em;
        }
        .sub { margin: 8px 0 24px; color: var(--sub); font-weight: 700; }
        .note { line-height: 1.8; margin-bottom: 28px; }
        .back {
            display: inline-block;
            padding: 10px 20px;
            border: 3px solid var(--text);
            background: #fff;
            color: var(--text);
            text-decoration: none;
            font-family: 'Dela Gothic One', sans-serif;
            box-shadow: 4px 4px 0 var(--text);
        }
        .back:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--text); }
    </style>
</head>
<body>
    <main class="card">
        <span class="badge">BOOKKEEPING EXAM PREP SYSTEM</span>
        <h1>R-EDGER</h1>
        <p class="sub">全経簿記 試験対策システム（4級・3級・2級）</p>
        <p class="note">
            ただいま公開準備中です。<br>
            受講のお申し込み・ログインは、もうしばらくお待ちください。
        </p>
        <a class="back" href="https://jprojectsriki-cpu.github.io/rikis_collection/">← ポートフォリオに戻る</a>
    </main>
</body>
</html>
